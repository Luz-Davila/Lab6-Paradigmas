<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      .barra {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; background: #111; color: #fff;
        position: sticky; top: 0; z-index: 1;
      }
      .barra img { width: 28px; height: 28px; border-radius: 50%; background: #555; }
      .barra .nombre { font-weight: bold; flex: 1; }
      .barra button {
        background: transparent; color: #fff; border: 1px solid #666;
        border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit;
      }
      .barra button:hover { background: #333; }
      .aviso {
        display: none; padding: 10px 12px; background: #fff3cd; color: #664d03;
        border-bottom: 1px solid #ffe69c;
      }
      .aviso.visible { display: block; }
      .aviso a { color: #664d03; font-weight: bold; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px; width: 89%; }
      form button { width: 10%; background: rgb(130, 224, 255);  border: none; padding: 10px; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages li { padding: 5px 10px; overflow-wrap: anywhere; }
      #messages li:nth-child(odd) { background: #eee; }
      #messages { margin-bottom: 40px }
      .media-chat {
        display: block;
        max-width: min(100%, 400px);
        max-height: 400px;
        margin-top: 6px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      iframe.media-chat { width: 100%; max-width: 560px; height: 315px; }
    </style>
  </head>
  <body>
    <header class="barra">
      <img id="avatar" alt="" hidden>
      <span class="nombre" id="usuario">Cargando…</span>
      <button type="button" id="salir">Cerrar sesión</button>
    </header>

    <p class="aviso" id="aviso">
      Tu sesión terminó. <a href="/login">Volver a iniciar sesión</a>
    </p>

    <ul id="messages"></ul>
    <form action="">
      <input id="m" autocomplete="off" maxlength="2000" placeholder="Mensaje o URL de imagen/video" /><button>Send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/jquery.min.js"></script>
    <script>

    var colorHexTxt = "";

    var COLOR_POR_DEFECTO = '#000000';
    var RE_COLOR_HEX = /^#[0-9A-Fa-f]{6}$/;
    var RE_ID_YOUTUBE = /^[A-Za-z0-9_-]{11}$/;
    var RE_URL_HTTP = /^https?:\/\//i;
    var RE_CARACTERES_PELIGROSOS = /[<>"'\s]/;

    // genera colores aleatorios en hexadeximal
    function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }

        return color;
     }

    function colorSeguro(color) {
        return typeof color === 'string' && RE_COLOR_HEX.test(color) ? color : COLOR_POR_DEFECTO;
    }

    function urlSegura(url) {
        return typeof url === 'string' &&
            RE_URL_HTTP.test(url) &&
            !RE_CARACTERES_PELIGROSOS.test(url)
            ? url
            : null;
    }

    // Construye el nodo del mensaje con la API del DOM: nunca se concatena
    // HTML con datos del usuario. Solo el texto ya escapado por el servidor
    // se inserta como HTML.
    function nodoContenido(msgJson) {
        var tipo = msgJson.tipo || 'texto';
        var url = urlSegura(msgJson.url);

        if (tipo === 'imagen' && url) {
            return $('<img>')
                .attr({
                    src: url,
                    alt: 'Imagen compartida en el chat',
                    loading: 'lazy',
                    referrerpolicy: 'no-referrer'
                })
                .addClass('media-chat')
                .on('error', function () {
                    $(this).replaceWith($('<span>').text('No se pudo cargar la imagen: ' + url));
                });
        }

        if (tipo === 'video' && url) {
            return $('<video>')
                .attr({
                    src: url,
                    controls: 'controls',
                    preload: 'metadata',
                    playsinline: 'playsinline'
                })
                .addClass('media-chat')
                .on('error', function () {
                    $(this).replaceWith($('<span>').text('No se pudo cargar el video: ' + url));
                });
        }

        if (tipo === 'video_youtube' && RE_ID_YOUTUBE.test(msgJson.videoId || '')) {
            return $('<iframe>')
                .attr({
                    src: 'https://www.youtube.com/embed/' + msgJson.videoId,
                    title: 'Video de YouTube',
                    frameborder: '0',
                    allow: 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture',
                    allowfullscreen: 'allowfullscreen',
                    referrerpolicy: 'strict-origin-when-cross-origin'
                })
                .addClass('media-chat');
        }

        if (tipo !== 'texto') {
            // Tipo de medio desconocido o URL invalida: no se renderiza nada.
            return $('<span>').text('Contenido no disponible');
        }

        // El servidor ya escapo el texto con escapeHtml/validateMessage.
        return $('<span>').html(typeof msgJson.mensaje === 'string' ? msgJson.mensaje : '');
    }

    function mostrarAviso(texto) {
        var $aviso = $('#aviso');
        if (texto) {
            $aviso.text(texto + ' ').append($('<a>').attr('href', '/login').text('Volver a iniciar sesión'));
        }
        $aviso.addClass('visible');
    }

    // La identidad la decide el servidor: acá solo se muestra.
    function cargarIdentidad() {
        return fetch('/api/me', { credentials: 'same-origin' })
            .then(function (respuesta) {
                if (respuesta.status === 401) {
                    window.location.href = '/login';
                    return null;
                }
                if (!respuesta.ok) {
                    throw new Error('No se pudo obtener la identidad');
                }
                return respuesta.json();
            })
            .then(function (identidad) {
                if (!identidad) {
                    return;
                }
                $('#usuario').text(identidad.nombre || 'Usuario');
                if (identidad.picture) {
                    $('#avatar').attr('src', identidad.picture).prop('hidden', false);
                }
            })
            .catch(function () {
                $('#usuario').text('Usuario');
                mostrarAviso('No pudimos cargar tu perfil.');
            });
    }

      $(function () {
        cargarIdentidad();

        var socket = io();

        $('#salir').on('click', function () {
            window.location.href = '/logout';
        });

        socket.on('connect_error', function (error) {
            var mensaje = error && error.message === 'unauthorized'
                ? 'Tu sesión terminó.'
                : 'Se perdió la conexión con el chat.';
            mostrarAviso(mensaje);
        });

        // emite evento al servidor

        $('form').submit(function(){
            var mensajeTxt = $('#m').val();

            // No se envian mensajes vacios ni solo espacios.
            if (!mensajeTxt || !mensajeTxt.trim()) {
                $('#m').val('');
                return false;
            }

            if (colorHexTxt == "") {
                colorHexTxt = getRandomColor();
            }

            // El nombre no se envía: el servidor usa el de la sesión.
            var jsonMsg = { mensaje: mensajeTxt, color: colorHexTxt };
            socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
            $('#m').val('');
            return false;
        });

        socket.on('Evento-Mensaje-Server', function(msg){
            var msgJson;

            try {
                msgJson = JSON.parse(msg);
            } catch (e) {
                console.error('Mensaje invalido recibido del servidor');
                return;
            }

            var $nombre = $('<b>')
                .css('color', colorSeguro(msgJson.color))
                .text(msgJson.nombre || 'Anónimo');

            var $li = $('<li>')
                .append($nombre)
                .append(document.createTextNode(': '))
                .append(nodoContenido(msgJson));

            $('#messages').append($li);
            window.scrollTo(0, document.body.scrollHeight);
        });

      });
    </script>
  </body>
</html>
